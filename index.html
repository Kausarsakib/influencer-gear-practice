<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Influencer</title>
    <script src="https://kit.fontawesome.com/f63dfbbe9e.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="poppins-font">
    <!-- header section -->
     <header>
         <nav class="navbar">
             <h1 class="logo">Influencer products</h1>
             <ul class="nav-menu">
                <li><a href="#">Home</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">Sign Up</a></li>
                <li><a href="#">Log In</a></li>
                <li><a class="search-icon" href="#"><i class="fa-solid fa-magnifying-glass"></i></a></li>
                <li><a class="cart-icon" href="#"><i class="fa-solid fa-cart-shopping"></i></i></a></li>
             </ul>
         </nav>
     </header>
     <!-- Banner section -->
    <section class="banner">
         <div class="banner-text">
             <h1 class="banner-title">Start your Journey as <br> Influencer</h1>
             <p class="banner-description">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sem vestibulum sed scelerisque eros. Lectus faucibus.</p>
             <button class="btn">Preebook Now</button>
         </div>

         <div class="banner-image">
             <div class="circle-bg">
                <img src="images/main-camera.png" alt="Camera">
             </div>
         </div>
    </section>
    <!-- Brand logos section -->
     <section class="brands">
        <hr>
         <div class="brand-logos">
            <img src="logos/Alibaba.svg" alt="Alibaba">
            <img src="logos/Amazon.svg" alt="Amazon">
            <img src="logos/Daraz.pk Logo.svg" alt="Daraz">
            <img src="logos/Ebay.svg" alt="Ebay">
            <img src="logos/Rakuten.svg" alt="Rakuten">
            <img src="logos/Walmart.svg" alt="Walmart">
            <img src="logos/Target.svg" alt="Target">
        </div>
        <hr>
     </section>
</body>
</html>
